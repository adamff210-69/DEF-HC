name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test suite
        run: pytest -q
      - name: Required demonstration
        run: python -m defend_hc2 --no-color
      - name: Layer-complementarity evaluation
        run: python scripts/evaluate_complementarity.py

  ml-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with ML extra)
        run: |
          pip install -r requirements-ml.txt
      - name: Train embedding classifier (bge-small)
        run: |
          python scripts/train_classifier.py \
            --out defend_hc2/weights/bge-logistic.json --epochs 200
      - name: Test (embedding mode enabled)
        run: pytest -q
